<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f8">
    <meta name="description" content="豆包输入法图标仓库，点击图标复制图片直链。">
    <title>豆包输入法图标仓库</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="page-shell" id="top">
      <header class="topbar">
        <a class="brand" href="#top" aria-label="返回首页">
          <span class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </span>
          <span class="brand-copy">
            <strong>豆包输入法图标仓库</strong>
            <small>IMAGE LINK TOOL</small>
          </span>
        </a>
        <div class="topbar-actions">
          <span class="site-label">图片直链工具</span>
          <a class="header-link" href="#library">浏览图标</a>
        </div>
      </header>

      <main>
        <section class="tool-intro" aria-labelledby="intro-title">
          <div class="intro-copy">
            <p class="eyebrow">豆包输入法 · 图标仓库</p>
            <h1 id="intro-title">选择图标，<br class="mobile-only-break">复制直链</h1>
            <p class="intro-description">
              给输入法左上角换一个喜欢的图标。点击任意卡片，图片直链会自动复制到剪切板。
            </p>
            <p class="format-note">
              支持 <b>PNG</b> / <b>GIF</b> / <b>JPG</b>
              <span class="note-separator">·</span>
              当前素材 <strong data-stat="total">13</strong> 个
            </p>
          </div>

          <aside class="usage-card" aria-label="使用方法">
            <p class="usage-title">使用方法</p>
            <ol class="usage-list">
              <li><span>1</span><b>点击图标</b></li>
              <li><span>2</span><b>复制直链</b></li>
              <li><span>3</span><b>粘贴到输入法设置</b></li>
            </ol>
          </aside>
        </section>

        <section class="library" id="library" aria-labelledby="library-title">
          <div class="library-toolbar">
            <div>
              <p class="section-kicker">图标库</p>
              <h2 id="library-title">选择你要的图标</h2>
            </div>
            <p class="toolbar-hint">点击卡片或按钮复制直链</p>
          </div>

          <nav class="category-nav" aria-label="图标分类">
            <a class="category-link active" href="#animated">
              <span class="category-name-full">动态图标</span>
              <span class="category-name-short">动态</span>
              <b data-category-count="animated">10</b>
            </a>
            <a class="category-link" href="#static">
              <span class="category-name-full">静态图标</span>
              <span class="category-name-short">静态</span>
              <b data-category-count="static">2</b>
            </a>
            <a class="category-link" href="#default">
              <span class="category-name-full">默认图标</span>
              <span class="category-name-short">默认</span>
              <b data-category-count="default">1</b>
            </a>
          </nav>

          <div id="icon-sections"></div>
        </section>
      </main>

      <footer class="footer">
        <p>豆包输入法图标仓库 · 点击图标复制直链</p>
        <a href="#top">回到顶部 ↑</a>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span class="toast-check" aria-hidden="true">✓</span>
      <span id="toast-message">已复制直链</span>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
