<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f8">
    <meta name="description" content="豆包输入法图标仓库，点击图标复制图片直链。">
    <title>豆包输入法图标仓库</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="page-shell" id="top">
      <header class="topbar">
        <a class="brand" href="#top" aria-label="返回图标库顶部">
          <span class="brand-copy">
            <strong>豆包输入法图标仓库</strong>
            <small>IMAGE LINK TOOL</small>
          </span>
        </a>
        <div class="topbar-actions">
          <span class="site-label">点击图标复制 CDN 直链</span>
          <a class="header-link" href="#library">回到图标库</a>
        </div>
      </header>

      <main>
        <section class="library" id="library" aria-labelledby="library-title">
          <div class="library-toolbar">
            <div>
              <p class="section-kicker">图标库</p>
              <h1 id="library-title">选择图标，复制直链</h1>
            </div>
            <p class="toolbar-hint">点击卡片或按钮即可复制</p>
          </div>

          <div class="category-nav" role="tablist" aria-label="图标分类">
            <button class="category-tab active" id="tab-shared" type="button" role="tab" aria-selected="true" aria-controls="shared" data-category="shared">
              <span class="category-name-full">群友分享</span>
              <span class="category-name-short">分享</span>
              <b data-category-count="shared">13</b>
            </button>
            <button class="category-tab" id="tab-ime-presets" type="button" role="tab" aria-selected="false" aria-controls="ime-presets" data-category="ime-presets" tabindex="-1">
              <span class="category-name-full">输入法预设</span>
              <span class="category-name-short">预设</span>
              <b data-category-count="ime-presets">14</b>
            </button>
            <button class="category-tab" id="tab-recommended-static" type="button" role="tab" aria-selected="false" aria-controls="recommended-static" data-category="recommended-static" tabindex="-1">
              <span class="category-name-full">静态推荐</span>
              <span class="category-name-short">静态</span>
              <b data-category-count="recommended-static">16</b>
            </button>
            <button class="category-tab" id="tab-recommended-animated" type="button" role="tab" aria-selected="false" aria-controls="recommended-animated" data-category="recommended-animated" tabindex="-1">
              <span class="category-name-full">动态推荐</span>
              <span class="category-name-short">动态</span>
              <b data-category-count="recommended-animated">13</b>
            </button>
          </div>

          <div id="icon-sections"></div>
        </section>
      </main>

      <footer class="footer">
        <p>logo.agar-cabin.site · 点击图标复制直链</p>
        <a href="#top">回到顶部 ↑</a>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span class="toast-check" aria-hidden="true">✓</span>
      <span id="toast-message">已复制直链</span>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
