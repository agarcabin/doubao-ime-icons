<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f8">
    <meta name="description" content="豆包输入法图标仓库，点击图标复制图片直链。">
    <title>豆包输入法图标仓库</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="page-shell" id="top">
      <header class="topbar">
        <a class="brand" href="#top" aria-label="返回图标库顶部">
          <span class="brand-copy">
            <strong>豆包输入法图标仓库</strong>
            <small>IMAGE LINK TOOL</small>
          </span>
        </a>
        <div class="topbar-actions">
          <span class="site-label">点击图标复制 CDN 直链</span>
          <a class="header-link" href="#library">回到图标库</a>
        </div>
      </header>

      <main>
        <section class="library" id="library" aria-labelledby="library-title">
          <div class="library-toolbar">
            <div>
              <h1 id="library-title">logo图标库</h1>
              <p class="library-subtitle">点击你喜欢的logo，一键复制直链</p>
              <p class="qq-group">QQ交流群：6494286</p>
            </div>
          </div>

          <nav class="category-nav" aria-label="图标分类定位">
            <a class="category-tab active" id="tab-shared" href="#shared" aria-current="true" data-category="shared">
              <span class="category-name-full">群友分享</span>
              <span class="category-name-short">分享</span>
              <b data-category-count="shared">13</b>
            </a>
            <a class="category-tab" id="tab-ime-presets" href="#ime-presets" data-category="ime-presets">
              <span class="category-name-full">输入法预设</span>
              <span class="category-name-short">预设</span>
              <b data-category-count="ime-presets">13</b>
            </a>
            <a class="category-tab" id="tab-recommended-static" href="#recommended-static" data-category="recommended-static">
              <span class="category-name-full">静态推荐</span>
              <span class="category-name-short">静态</span>
              <b data-category-count="recommended-static">36</b>
            </a>
            <a class="category-tab" id="tab-recommended-animated" href="#recommended-animated" data-category="recommended-animated">
              <span class="category-name-full">动态推荐</span>
              <span class="category-name-short">动态</span>
              <b data-category-count="recommended-animated">33</b>
            </a>
          </nav>

          <div id="icon-sections"></div>
        </section>
      </main>

      <footer class="footer">
        <p>logo.agar-cabin.site · 点击图标复制直链</p>
        <a href="#top">回到顶部 ↑</a>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span class="toast-check" aria-hidden="true">✓</span>
      <span id="toast-message">已复制直链</span>
    </div>

    <script src="image-urls.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
